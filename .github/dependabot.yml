version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    # These versions are the lowest the shipped packages accept (or, for the add-ons, the test defaults next to the
    # lowest), so they move by hand: a bump raises every consumer's floor. Patches of the netstandard polyfills still
    # come through, for advisories.
    ignore:
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "System.Threading.Channels"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "System.IO.Hashing"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Memory"
      - dependency-name: "Snappier"
      - dependency-name: "Snappiest"
      - dependency-name: "ZstdSharp.Port"
      - dependency-name: "SharpZipLib"
      - dependency-name: "Lzma.Net"
      - dependency-name: "Confluent.*"
      - dependency-name: "KafkaFlow*"
      - dependency-name: "Azure.Data.SchemaRegistry"
      - dependency-name: "AWSSDK.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
