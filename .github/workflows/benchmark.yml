name: Benchmarks

# Scaffold for the performance gate (AvroSharp must beat Apache.Avro on every scenario).
# The comparative gate and per-commit result storage arrive with the M1 benchmarks.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run benchmarks
        run: dotnet run -c Release --project bench/AvroSharp.Benchmarks -- --filter '*' --job short --exporters json

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/**
