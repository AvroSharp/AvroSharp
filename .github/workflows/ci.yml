name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  NUGET_CERT_REVOCATION_MODE: offline

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A green run takes 5 to 15 minutes. A hung test host (#183: a test waited for a cancellation that never came) ran
    # until GitHub's 6-hour limit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows, x64 and Arm64. On Windows the tests also run on net481: the netstandard2.0 build on
        # .NET Framework.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Formatting is not checked in CI; run `dotnet format` locally when needed (see CONTRIBUTING.md).
      - name: Restore
        run: dotnet restore AvroSharp.slnx

      - name: Build
        run: dotnet build AvroSharp.slnx -c Release --no-restore

      # On Windows this includes net481, which runs the netstandard2.0 build on .NET Framework.
      # A failing random-schema batch (#141) is saved with the test results, which are uploaded below.
      - name: Test
        env:
          AVROSHARP_RANDOM_SCHEMA_FAILURES: ${{ github.workspace }}/TestResults/random-schema-failure
        run: dotnet test --solution AvroSharp.slnx -c Release --no-build --coverage --coverage-output-format cobertura

      # Line and branch coverage of the shipped assemblies, merged across the test projects and target frameworks, in
      # the run's summary (linked from the pull request's checks). The script checks that no report is empty.
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: build/coverage-summary.sh

      # The coverage badge's data, which the docs workflow publishes with the site after a successful run on main.
      - name: Upload the coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: artifacts/coverage/coverage.json
          if-no-files-found: error

      # AvroSharp.Confluent and AvroSharp.KafkaFlow against a real broker and registry: Redpanda in Docker, which needs
      # Linux containers, so only the x64 Linux runner. The tests are [Explicit], so the solution run above leaves them out.
      - name: Test against Redpanda
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test --project tests/AvroSharp.Confluent.Tests -c Release --no-build --treenode-filter "/*/*/RedpandaTests/*"
          dotnet test --project tests/AvroSharp.KafkaFlow.Tests -c Release --no-build --treenode-filter "/*/*/KafkaFlowRedpandaTests/*"

      # Vector and bit-manipulation fast paths fall back to scalar code without hardware intrinsics; run the unit
      # tests that way too so the fallbacks are exercised on every build.
      - name: Test without hardware intrinsics
        if: matrix.os == 'ubuntu-latest'
        env:
          DOTNET_EnableHWIntrinsic: 0
        run: dotnet test --project tests/AvroSharp.Tests -c Release --no-build -f net10.0

      # Each sample checks its own results and exits with 1 when one is wrong. The Confluent and KafkaFlowEvents samples
      # need a broker and a registry: the Confluent sample's compose file starts Redpanda.
      - name: Samples
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker compose -f samples/Confluent/compose.yaml up -d --wait
          for sample in samples/*/; do
            dotnet run --project "$sample" -c Release --no-build
          done
          docker compose -f samples/Confluent/compose.yaml down

      - name: Native AOT smoke test
        shell: bash
        run: |
          dotnet publish tests/AvroSharp.AotSmoke -c Release -r ${{ matrix.rid }}
          ./artifacts/publish/AvroSharp.AotSmoke/release_${{ matrix.rid }}/AvroSharp.AotSmoke

      - name: Pack
        run: dotnet pack AvroSharp.slnx -c Release --no-build

      # Restores small consumer projects from the packed packages alone and runs them, and installs and runs the
      # tool: the packaging (dependency groups, the generator's analyzers folder, the tool's builds) is tested as a
      # user meets it, which project references cannot show (#136).
      - name: Package consumers
        shell: bash
        run: build/test-packages.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            artifacts/bin/**/TestResults/**
            TestResults/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/package/release/*

