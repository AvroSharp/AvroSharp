name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: checkout needs contents, and CodeQL reads the run (actions) in private repositories.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      # The shipped projects only: tests, benchmarks and fuzz targets are not analyzed.
      - name: Build
        run: |
          dotnet build src/AvroSharp.Codecs -c Release
          dotnet build src/AvroSharp.Generators -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
