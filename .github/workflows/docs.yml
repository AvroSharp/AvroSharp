name: Docs

# Builds the documentation site (DocFX: the guide and docs from Markdown, the API reference from the XML
# documentation) and publishes it to GitHub Pages from main, after CI passes there: the site also carries that run's
# coverage, which the README's badge reads (coverage.json). Pull requests build it, so broken links fail them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # After CI on main, only when it passed: the site is the code CI tested, with its coverage.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the coverage artifact of the CI run
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Broken links and bookmarks fail the build. Other warnings don't: on Linux the metadata step reports the
      # AvroSharp project reference as unmatched, although the API pages come out complete.
      - name: Build the site
        shell: bash
        run: |
          dotnet tool restore
          dotnet tool run docfx docfx.json 2>&1 | tee docfx.log
          if grep -E "InvalidFileLink|InvalidBookmark|UidNotFound" docfx.log; then
            echo "::error::The documentation has broken links"
            exit 1
          fi

      # The READMEs and guides link the API with absolute URLs, which DocFX doesn't check.
      - name: Check the API links
        shell: bash
        run: build/check-api-links.sh

      # The coverage of the CI run that triggered this one, or for a manual run, of the latest passing CI run on main.
      - name: Add the coverage badge
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run=${RUN_ID:-$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')}
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage-badge --dir artifacts/coverage-badge
          cp artifacts/coverage-badge/coverage.json artifacts/docs/coverage.json
          cat artifacts/docs/coverage.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.event.workflow_run.head_branch || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
